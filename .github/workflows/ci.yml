# Fast checks on every push and pull request.
# Baseline mode: the build step is blocking; gofmt, vet and tests only report.
# After the first green run, remove "continue-on-error" from the steps you want enforced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The embedded core and daemon bundles are optional at compile time
      # (go:embed all:...), so a plain checkout compiles without them.
      - name: Build
        run: CGO_ENABLED=1 go build ./...

      # Files listed in .github/gofmt-baseline.txt were already unformatted upstream.
      # Any other unformatted file fails the build.
      - name: Formatting
        run: |
          export LC_ALL=C
          { gofmt -l . | grep -v '^third_party/' || true; } | sort > gofmt-now.txt
          { grep -v '^#' .github/gofmt-baseline.txt || true; } | sort > gofmt-baseline.txt
          new="$(comm -13 gofmt-baseline.txt gofmt-now.txt)"
          if [ -n "$new" ]; then
            echo "Files need gofmt (not in the baseline):"
            echo "$new"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          go test ./... -count=1 -timeout 15m 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log
          path: test.log
          if-no-files-found: ignore
          retention-days: 7
